services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capsula
      POSTGRES_PASSWORD: capsula
      POSTGRES_DB: capsula
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capsula"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://capsula:capsula@db:5432/capsula
      CORS_ORIGIN: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
