# Render Blueprint: crea BD + backend + frontend de una sola vez
databases:
  - name: capsula-db
    plan: free
    databaseName: capsula
    user: capsula

services:
  - type: web
    name: capsula-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: capsula-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false   # URL del frontend, ej: https://capsula-frontend.onrender.com

  - type: web
    name: capsula-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # URL del backend, ej: https://capsula-backend.onrender.com
